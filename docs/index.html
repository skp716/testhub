<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>TestHub | Secure Examination</title>
<style>:root{--p:#2563eb;--navy:#0f172a;--bg:#f1f5f9;--muted:#64748b;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#172033}button,input{font:inherit}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 10px 30px #0f172a0d}.center{max-width:520px;margin:6vh auto}.brand{text-align:center;margin-bottom:24px}.brand b{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:17px;background:var(--p);color:#fff;font-size:22px}.brand h1{margin:12px 0 4px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55}.primary{background:var(--p);color:#fff}.danger{background:var(--danger);color:#fff}.light{background:#e2e8f0}.wide{width:100%;margin-top:18px}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;margin:14px 0}.error{background:#fee2e2;color:#991b1b}.exam-head{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px}.head-inner{max-width:1180px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}.timer{font-size:20px;font-weight:850}.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.question{font-size:18px;line-height:1.55;white-space:pre-wrap}.option{display:flex;gap:10px;padding:13px;border:1px solid #cbd5e1;border-radius:11px;margin:10px 0;cursor:pointer}.option:has(input:checked){border-color:var(--p);background:#eff6ff}.option input{width:auto}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qbtn{border:0;border-radius:8px;padding:9px 0;background:#e2e8f0}.qbtn.current{outline:2px solid var(--p)}.qbtn.answered{background:#bbf7d0}.qbtn.review{background:#fde68a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#e2e8f0;font-size:12px}.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}#resultView{text-align:center}.score{font-size:42px;font-weight:900;color:var(--p)}@media(max-width:800px){.exam-grid{grid-template-columns:1fr}.side{order:-1}.palette{grid-template-columns:repeat(10,1fr)}.shell{padding:10px}.card{padding:16px}}@media(max-width:480px){.palette{grid-template-columns:repeat(8,1fr)}.actions .btn{flex:1}.question{font-size:16px}}</style></head>
<body><main id="loginView" class="shell"><section class="card center"><div class="brand"><b>TH</b><h1>TestHub</h1><div class="muted">Secure Examination Portal</div></div><div id="examInfo" class="notice">परीक्षा की जानकारी लोड हो रही है…</div><form id="candidateForm"><label for="candidateName">पूरा नाम</label><input id="candidateName" maxlength="80" autocomplete="name" required><label for="candidateEmail">ईमेल</label><input id="candidateEmail" type="email" maxlength="120" autocomplete="email" required><label for="centerCode">Exam Center Code</label><input id="centerCode" maxlength="40" autocomplete="off" required><label class="option"><input id="consent" type="checkbox" required> मैं fullscreen, timer और anti-cheating नियमों से सहमत हूँ।</label><button id="startBtn" class="btn primary wide" type="submit" disabled>परीक्षा शुरू करें</button></form><div id="loginMessage" class="notice hidden"></div><p class="muted" style="font-size:12px">Tab/app बदलने, copy, print या fullscreen छोड़ने पर penalty लग सकती है।</p></section></main>
<section id="examView" class="hidden"><header class="exam-head"><div class="head-inner"><div><strong id="examTitle">TestHub Examination</strong><br><small id="candidateLabel"></small></div><div class="timer" id="timer">00:00</div></div></header><main class="shell exam-grid"><section class="card"><div class="status-row"><span class="pill" id="questionNumber"></span><span class="pill" id="securityCount">Violations: 0</span><span class="pill" id="penaltyCount">Penalty: 0</span></div><div id="questionText" class="question"></div><div id="options"></div><div class="actions"><button id="prevBtn" class="btn light">पिछला</button><button id="reviewBtn" class="btn light">Review</button><button id="saveNextBtn" class="btn primary">Save & Next</button><button id="submitBtn" class="btn danger">Final Submit</button></div></section><aside class="card side"><h3 style="margin-top:0">Questions</h3><div id="palette" class="palette"></div><p class="muted" style="font-size:12px">हरा: answered · पीला: review</p></aside></main></section>
<main id="resultView" class="shell hidden"><section class="card center"><h1>परीक्षा जमा हो गई</h1><div id="finalScore" class="score"></div><div id="finalStats"></div><p class="muted">आपका result record कर लिया गया है।</p></section></main><script type="module" src="student.js"></script></body></html>
